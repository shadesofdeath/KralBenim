<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0a0a0b; font-family: Inter, sans-serif; }
  .logo { position: relative; width: 800px; height: 800px; overflow: hidden;
    background: radial-gradient(circle at 50% 46%, #1b1b1f 0%, #0d0d0f 55%, #0a0a0b 75%); }
  svg { display: block; }
</style></head><body>

<!-- A: rounded airplane window (the channel's first story) framing a question mark -->
<div class="logo" id="A">
<svg viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="skyA" cx="50%" cy="72%" r="65%"><stop offset="0" stop-color="#d9a441" stop-opacity=".38"/><stop offset="1" stop-color="#d9a441" stop-opacity="0"/></radialGradient>
    <clipPath id="paneA"><rect x="268" y="148" width="264" height="504" rx="118"/></clipPath>
  </defs>
  <rect x="228" y="108" width="344" height="584" rx="158" fill="none" stroke="#f5f5f7" stroke-width="26"/>
  <rect x="268" y="148" width="264" height="504" rx="118" fill="#101013"/>
  <g clip-path="url(#paneA)">
    <rect x="268" y="148" width="264" height="504" fill="url(#skyA)"/>
    <path d="M268 540 H532" stroke="#d9a441" stroke-width="5" opacity=".7"/>
  </g>
  <path d="M338 300 C338 250 368 222 402 222 C440 222 466 248 466 286 C466 322 442 338 422 350 C404 361 400 374 400 398 V418"
        fill="none" stroke="#f5f5f7" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="478" r="27" fill="#d9a441" style="filter: drop-shadow(0 0 18px rgba(217,164,65,.9))"/>
</svg>
</div>

<!-- B: question mark drawn by our flowing "load lines", amber dot -->
<div class="logo" id="B">
<svg viewBox="0 0 800 800" width="800" height="800">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="qB" d="M250 300 C250 190 320 130 405 130 C495 130 555 190 555 270 C555 345 500 380 455 405 C415 428 400 455 400 505 V530" stroke="#f5f5f7" stroke-width="70"/>
    <path d="M250 300 C250 190 320 130 405 130 C495 130 555 190 555 270 C555 345 500 380 455 405 C415 428 400 455 400 505 V530" stroke="#0d0d0f" stroke-width="10" stroke-dasharray="28 22" transform="translate(0 0)"/>
    <path d="M200 300 C200 160 300 85 405 85" stroke="#e5484d" stroke-width="6" stroke-dasharray="22 16" opacity=".85"/>
    <path d="M600 270 C600 360 545 410 500 438" stroke="#d9a441" stroke-width="6" stroke-dasharray="22 16" opacity=".85"/>
  </g>
  <circle cx="400" cy="635" r="46" fill="#d9a441" style="filter: drop-shadow(0 0 24px rgba(217,164,65,.85))"/>
</svg>
</div>

<!-- C: monogram — a bold "D" whose counter holds an amber "?" -->
<div class="logo" id="C">
<svg viewBox="0 0 800 800" width="800" height="800">
  <path d="M215 160 H380 C530 160 610 260 610 400 C610 540 530 640 380 640 H215 Z" fill="#f5f5f7"/>
  <path d="M300 245 H375 C460 245 520 300 520 400 C520 500 460 555 375 555 H300 Z" fill="#0f0f12"/>
  <path d="M352 352 C352 318 374 300 400 300 C428 300 448 318 448 344 C448 368 432 380 418 388 C406 395 402 404 402 420 V430"
        fill="none" stroke="#d9a441" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="402" cy="480" r="17" fill="#d9a441" style="filter: drop-shadow(0 0 12px rgba(217,164,65,.9))"/>
</svg>
</div>
</body></html>
