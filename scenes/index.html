<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0a0a0b; --card: #141416; --edge: #232327;
    --white: #f5f5f7; --gray: #8a8a8e; --amber: #d9a441; --red: #e5484d;
  }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: Inter, sans-serif; color: var(--white); -webkit-font-smoothing: antialiased; }
  #stage {
    position: relative; width: 1080px; height: 1920px;
    background: radial-gradient(ellipse 950px 850px at 50% 40%, rgba(255,255,255,.05), rgba(255,255,255,0) 70%), var(--bg);
  }
  .title {
    position: absolute; left: 80px; right: 80px; bottom: 1320px;
    font-weight: 800; font-size: 84px; line-height: 1.06; letter-spacing: -0.03em;
  }
  .title span { display: inline-block; margin-right: .24em; }
  .title .g { color: var(--gray); }
  #card {
    position: absolute; left: 80px; top: 640px; width: 920px; height: 680px;
    background: var(--card); border-radius: 28px; border: 1.5px solid var(--edge);
    box-sizing: border-box; overflow: hidden;
  }
  #card svg { position: absolute; left: -1.5px; top: -1.5px; width: 920px; height: 680px; }
  .tags { position: absolute; left: 80px; right: 80px; top: 1356px; display: flex; flex-wrap: wrap; gap: 16px; }
  .tag {
    border: 1.5px solid #2e2e33; border-radius: 999px; padding: 14px 30px;
    font-size: 34px; font-weight: 500; color: #c9c9cd; letter-spacing: -0.01em;
  }
  #caption {
    position: absolute; left: 110px; right: 110px; top: 1500px;
    text-align: center; font-size: 66px; font-weight: 800; line-height: 1.18; letter-spacing: -0.02em;
    text-shadow: 0 4px 24px rgba(0,0,0,.6);
  }
  #caption span { transition: none; }

  /* cover (thumbnail) mode */
  #covertext { display: none; }
  html.cover .title, html.cover .tags, html.cover #caption, html.cover #progress { display: none !important; }
  html.cover #covertext {
    display: block; position: absolute; left: 80px; right: 80px; top: 200px;
    font-weight: 900; font-size: 124px; line-height: 1.12; letter-spacing: -0.04em; text-transform: uppercase;
  }
  html.cover #covertext .hl { color: var(--amber); }
  html.cover #covertext .line { display: block; }
  html.cover #card { top: 860px; box-shadow: 0 0 160px rgba(217,164,65,.18); border-color: #34343a; transform: scale(1.04) !important; opacity: 1 !important; }
  html.cover #brand { font-size: 44px; opacity: 1 !important; }
  html.cover #brand i { width: 22px; height: 22px; }
  html.cover #covertext .hl {
    color: #111; background: var(--amber); padding: .1em .14em 0; margin: .05em .18em .14em 0; border-radius: .12em;
    display: inline-block; transform: rotate(-2deg); box-shadow: 0 .06em .3em rgba(217,164,65,.35);
  }
  #covershade, #covermark { display: none; }

  /* long-form thumbnail: huge text left, illustration bleeding off the right edge */
  html.long.cover #stage { background: radial-gradient(ellipse 900px 700px at 74% 52%, rgba(217,164,65,.22), rgba(229,72,77,.06) 45%, rgba(0,0,0,0) 72%), #0a0a0b !important; }
  html.long.cover #card {
    left: 880px; top: 200px; background: transparent; border: none; box-shadow: none; overflow: visible;
    transform: scale(1.5) !important;
  }
  html.long.cover #card svg { overflow: visible; filter: drop-shadow(0 0 18px rgba(255,255,255,.12)); }
  html.long.cover #covershade {
    display: block; position: absolute; inset: 0;
    background: linear-gradient(90deg, #0a0a0b 0%, rgba(10,10,11,.96) 36%, rgba(10,10,11,.55) 50%, rgba(10,10,11,0) 64%);
  }
  html.long.cover #covertext {
    left: 90px; right: auto; width: 900px; top: 50%; transform: translateY(-46%);
    font-size: 168px; line-height: 0.98; text-shadow: 0 8px 40px rgba(0,0,0,.6);
  }
  html.long.cover #brand { left: 96px; top: 64px; font-size: 38px; z-index: 2; }
  html.long.cover #covermark { display: block; position: absolute; inset: 0; pointer-events: none; }

  /* 16:9 long-form layout */
  html.long, html.long body, html.long #stage { width: 1920px; height: 1080px; }
  html.long #stage { background: radial-gradient(ellipse 1100px 800px at 70% 45%, rgba(255,255,255,.05), rgba(255,255,255,0) 70%), var(--bg); }
  html.long #brand { left: 120px; top: 70px; font-size: 32px; }
  html.long .title { left: 120px; right: auto; width: 700px; bottom: auto; top: 190px; font-size: 68px; }
  html.long #card { left: 900px; top: 170px; }
  html.long .tags { left: 120px; right: auto; width: 700px; top: 760px; }
  html.long .tag { font-size: 30px; padding: 12px 26px; }
  html.long #caption { left: 260px; right: 260px; top: 900px; font-size: 46px; }
  html.long #progress { left: 120px; right: 120px; top: 1020px; }
  #progress { position: absolute; left: 80px; right: 80px; top: 1790px; height: 6px; border-radius: 3px; background: #1d1d20; }
  #bar { position: relative; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, #8a8a8e, var(--white)); }
  #bar::after { content: ''; position: absolute; right: -7px; top: -5px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--amber); box-shadow: 0 0 16px 2px rgba(217,164,65,.8); }
  #particles, #vignette { position: absolute; inset: 0; pointer-events: none; }
  #particles i { position: absolute; display: block; border-radius: 50%; background: #f5f5f7; }
  #vignette { background: radial-gradient(ellipse 75% 70% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 45%, rgba(217,164,65,.55), rgba(217,164,65,0) 65%); }
  #card svg { filter: drop-shadow(0 0 10px rgba(255,255,255,.07)) drop-shadow(0 0 22px rgba(217,164,65,.07)); }
  #caption span { display: inline-block; margin: 0 .16em; transform-origin: 50% 60%; }
  svg text { font-family: Inter, sans-serif; }
  #brand {
    position: absolute; left: 80px; top: 120px; display: flex; align-items: center; gap: 16px;
    font-size: 36px; font-weight: 700; letter-spacing: -0.01em; color: var(--white);
  }
  #brand i { width: 18px; height: 18px; border-radius: 50%; background: var(--amber); display: block; }
</style>
</head>
<body>
<div id="stage">
  <div id="particles"></div>
  <div id="brand"><i></i><span></span></div>
  <div id="titles"></div>
  <div id="card"></div>
  <div id="tagrows"></div>
  <div id="caption"></div>
  <div id="covershade"></div>
  <div id="covertext"></div>
  <svg id="covermark" viewBox="0 0 1920 1080" width="1920" height="1080"></svg>
  <div id="progress"><div id="bar"></div></div>
  <div id="vignette"></div>
</div>
<script>
// ------------------------------------------------------------ easing & helpers
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t;
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 24; i++) { t = (lo + hi) / 2; if (sx(t) < x) lo = t; else hi = t; }
    return sy(t);
  };
}
const EASE = bezier(.2, .8, .2, 1);
const clamp01 = v => Math.max(0, Math.min(1, v));
const prog = (t, a, d) => EASE(clamp01((t - a) / d));    // eased 0..1 from a over d seconds
// springy 0..1 with a little overshoot (titles, pops)
const spring = (t, a, d) => { const x = clamp01((t - a) / d); return x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(10 * x); };
// 1 at the hit moment, decaying fast (camera punch, flashes)
const punch = (t, at, d = 0.5) => (t >= at && t < at + d) ? Math.exp(-(t - at) * 8) : 0;
const lin = (t, a, d) => clamp01((t - a) / d);
const lerp = (a, b, p) => a + (b - a) * p;

const NS = 'http://www.w3.org/2000/svg';
function el(parent, tag, attrs = {}) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
const line = (p, d, stroke, w = 4, extra = {}) =>
  el(p, 'path', Object.assign({ d, fill: 'none', stroke, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1 }, extra));
function draw(e, p) {               // reveal a pathLength=1 stroke
  e.style.strokeDasharray = '1 1';
  e.style.strokeDashoffset = 1 - p;
  e.style.opacity = p > 0.002 ? 1 : 0;
}
function rrect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  return `M${x + w / 2} ${y} H${x + w - r} A${r} ${r} 0 0 1 ${x + w} ${y + r} V${y + h - r} A${r} ${r} 0 0 1 ${x + w - r} ${y + h}` +
         ` H${x + r} A${r} ${r} 0 0 1 ${x} ${y + h - r} V${y + r} A${r} ${r} 0 0 1 ${x + r} ${y} Z`;
}
// deterministic pseudo-random
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

const WHITE = '#f5f5f7', GRAY = '#8a8a8e', DIM = '#3a3a3f', AMBER = '#d9a441', RED = '#e5484d';

// ------------------------------------------------------------ icon library (100x100 boxes, stroke drawn)
const ICONS = {
  bulb: 'M50 10 C28 10 18 28 18 42 C18 56 30 62 34 72 H66 C70 62 82 56 82 42 C82 28 72 10 50 10 Z M36 80 H64 M40 88 H60 M44 96 H56',
  brain: 'M48 20 C38 10 20 16 22 30 C10 34 10 52 20 56 C14 68 26 82 38 76 C42 88 56 88 52 76 M52 20 C62 10 80 16 78 30 C90 34 90 52 80 56 C86 68 74 82 62 76 C58 88 44 88 48 76 M50 20 V82 M30 40 C38 42 40 48 36 54 M70 40 C62 42 60 48 64 54',
  eye: 'M8 50 C24 24 76 24 92 50 C76 76 24 76 8 50 Z M50 34 A16 16 0 1 1 49.9 34 M50 44 A6 6 0 1 1 49.9 44',
  clock: 'M50 10 A40 40 0 1 1 49.9 10 M50 26 V50 L66 60',
  globe: 'M50 10 A40 40 0 1 1 49.9 10 M10 50 H90 M50 10 C30 30 30 70 50 90 M50 10 C70 30 70 70 50 90 M16 30 H84 M16 70 H84',
  warning: 'M50 10 L92 86 H8 Z M50 38 V60 M50 70 V72',
  heart: 'M50 86 C20 64 8 46 14 30 C20 14 42 12 50 30 C58 12 80 14 86 30 C92 46 80 64 50 86 Z',
  drop: 'M50 8 C38 30 22 46 22 62 C22 80 36 92 50 92 C64 92 78 80 78 62 C78 46 62 30 50 8 Z M36 64 C36 74 42 80 50 80',
  fire: 'M50 92 C26 92 18 72 24 56 C30 42 40 38 38 18 C56 28 62 44 58 56 C66 52 68 44 66 36 C80 48 84 70 74 82 C68 88 60 92 50 92 Z',
  snow: 'M50 8 V92 M14 29 L86 71 M14 71 L86 29 M40 14 L50 24 L60 14 M40 86 L50 76 L60 86',
  bolt: 'M58 8 L22 56 H48 L40 92 L78 40 H52 Z',
  question: 'M32 34 C32 18 44 10 52 10 C66 10 74 20 74 32 C74 46 60 50 54 58 C52 62 52 66 52 70 M52 84 V88',
  check: 'M14 52 L38 76 L86 26',
  x: 'M18 18 L82 82 M82 18 L18 82',
  star: 'M50 8 L62 38 L94 40 L70 60 L78 92 L50 74 L22 92 L30 60 L6 40 L38 38 Z',
  magnet: 'M20 16 V54 C20 72 34 86 50 86 C66 86 80 72 80 54 V16 H62 V54 C62 62 56 68 50 68 C44 68 38 62 38 54 V16 Z M20 30 H38 M62 30 H80',
  atom: 'M50 46 A4 4 0 1 1 49.9 46 M50 50 m-42 0 a42 16 0 1 0 84 0 a42 16 0 1 0 -84 0 M50 50 m-21 -36 a42 16 60 1 0 42 72 a42 16 60 1 0 -42 -72 M29 86 a42 16 -60 1 0 42 -72 a42 16 -60 1 0 -42 72',
  gear: 'M50 30 A20 20 0 1 1 49.9 30 M50 8 V20 M50 80 V92 M8 50 H20 M80 50 H92 M20 20 L28 28 M72 72 L80 80 M80 20 L72 28 M28 72 L20 80',
  rocket: 'M50 8 C68 22 72 46 64 70 H36 C28 46 32 22 50 8 Z M50 34 A8 8 0 1 1 49.9 34 M36 60 L22 76 L34 78 M64 60 L78 76 L66 78 M42 76 L50 92 L58 76',
  leaf: 'M18 82 C18 40 46 14 88 12 C86 54 62 82 18 82 Z M18 82 C38 62 54 46 70 30',
  sound: 'M14 38 H30 L52 20 V80 L30 62 H14 Z M64 34 C72 42 72 58 64 66 M74 24 C88 38 88 62 74 76',
  hand: 'M34 92 C22 80 16 66 16 56 L20 44 C24 40 30 42 32 48 V24 C32 16 42 16 42 24 V44 V18 C42 10 54 10 54 18 V44 V22 C54 14 66 14 66 22 V46 V32 C66 24 78 24 78 32 V62 C78 80 66 92 52 92 Z',
  sun: 'M50 30 A20 20 0 1 1 49.9 30 M50 6 V18 M50 82 V94 M6 50 H18 M82 50 H94 M19 19 L27 27 M73 73 L81 81 M81 19 L73 27 M27 73 L19 81',
  moon: 'M66 12 C42 16 26 38 30 62 C34 82 54 94 76 88 C52 82 40 60 46 40 C50 26 58 18 66 12 Z',
};
function drawIcon(g, name, cx, cy, scale, stroke, accent) {
  const d = ICONS[name] || ICONS.question;
  const t = `translate(${cx - 50 * scale} ${cy - 50 * scale}) scale(${scale})`;
  if (accent) el(g, 'path', { d, transform: t, fill: 'none', stroke: accent, 'stroke-width': 10 / scale * 2.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.25 });
  el(g, 'path', { d, transform: t, fill: 'none', stroke, 'stroke-width': 7 / scale * 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
}

// ------------------------------------------------------------ illustrations
// Each builder gets (svg, params) and returns update(lt, dur, cues) with lt = scene-local time.
// cues are scene-local times of spoken words (may be missing → fallbacks).

function windowPane(g, x, y, w, h, r, stroke) {
  return [line(g, rrect(x, y, w, h, r), stroke, 5), line(g, rrect(x + 22, y + 22, w - 44, h - 44, Math.max(r - 18, 3)), GRAY, 2.5)];
}

const BUILD = {
  window_compare(svg, P) {
    const R = P.radius ?? 92;
    const left = windowPane(svg, 130, 150, 260, 360, 4, WHITE);
    const right = windowPane(svg, 530, 150, 260, 360, R, WHITE);
    const glow = el(svg, 'path', { d: rrect(552, 172, 216, 316, R - 18), fill: AMBER, opacity: 0 });
    right[0].parentNode.appendChild(right[0]);
    // red marks at the square corners
    const marks = [];
    for (const [cx, cy, sx, sy] of [[130, 150, -1, -1], [390, 150, 1, -1], [130, 510, -1, 1], [390, 510, 1, 1]]) {
      const g = el(svg, 'g');
      for (const a of [-0.5, 0, 0.5]) {
        const ang = Math.atan2(sy, sx) + a;
        line(g, `M${cx + Math.cos(ang) * 14} ${cy + Math.sin(ang) * 14} L${cx + Math.cos(ang) * 42} ${cy + Math.sin(ang) * 42}`, RED, 4);
      }
      marks.push(g);
    }
    const tick = el(svg, 'path', { d: '', fill: 'none' });
    return (lt, dur, c) => {
      const m = c.mark ?? dur * 0.6;
      draw(left[0], prog(lt, 0.1, 1.0)); draw(left[1], prog(lt, 0.45, 0.9));
      draw(right[0], prog(lt, 0.35, 1.0)); draw(right[1], prog(lt, 0.7, 0.9));
      marks.forEach((g, i) => {
        const p = prog(lt, m + i * 0.08, 0.6);
        g.style.opacity = p;
        g.setAttribute('transform', `translate(0 0)`);
        g.querySelectorAll('path').forEach(e => draw(e, p));
      });
      glow.setAttribute('opacity', 0.10 * prog(lt, m + 0.3, 1.0));
      right[0].setAttribute('stroke', lt > m + 0.3 ? AMBER : WHITE);
      right[0].style.opacity = right[0].style.opacity;
    };
  },

  plane(svg, P) { return buildPlane(svg, P, false); },
  plane_breakup(svg, P) { return buildPlane(svg, P, true); },

  pressure_cycle(svg, P) {
    const cx = 460, cy = 330, R0 = 190, A = 16, period = P.period ?? 1.5;
    const ghost = el(svg, 'circle', { cx, cy, r: R0, fill: 'none', stroke: DIM, 'stroke-width': 2, 'stroke-dasharray': '6 10' });
    const fill = el(svg, 'circle', { cx, cy, r: R0, fill: AMBER, opacity: 0 });
    const hull = el(svg, 'circle', { cx, cy, r: R0, fill: 'none', stroke: WHITE, 'stroke-width': 5, pathLength: 1, transform: `rotate(-90 ${cx} ${cy})` });
    const floor = line(svg, '', GRAY, 3);
    const wins = [0, 1].map(() => el(svg, 'rect', { width: 22, height: 30, rx: 4, fill: 'none', stroke: GRAY, 'stroke-width': 3 }));
    const arrows = [];
    for (let i = 0; i < 8; i++) arrows.push(line(svg, '', AMBER, 4));
    const label = el(svg, 'text', { x: 60, y: 620, fill: GRAY, 'font-size': 30, 'font-weight': 500 });
    label.textContent = 'basınç döngüsü';
    const count = el(svg, 'text', { x: 860, y: 622, fill: AMBER, 'font-size': 64, 'font-weight': 700, 'text-anchor': 'end', 'font-variant-numeric': 'tabular-nums' });
    return (lt, dur, c) => {
      const pIn = prog(lt, 0.1, 1.0);
      hull.style.strokeDasharray = '1 1'; hull.style.strokeDashoffset = 1 - pIn;
      const run = Math.max(0, lt - 0.9);
      const s = 0.5 - 0.5 * Math.cos(2 * Math.PI * run / period);   // 0..1 breathing
      const r = R0 + A * s;
      [hull, fill].forEach(e => e.setAttribute('r', r));
      fill.setAttribute('opacity', (0.03 + 0.10 * s) * pIn);
      ghost.style.opacity = pIn;
      const fy = cy + 70, fx = Math.sqrt(r * r - 70 * 70);
      floor.setAttribute('d', `M${cx - fx} ${fy} L${cx + fx} ${fy}`); draw(floor, prog(lt, 0.5, 0.8));
      [-150, -30].forEach((deg, i) => {
        const a = deg * Math.PI / 180, x = cx + Math.cos(a) * (r - 34), y = cy + Math.sin(a) * (r - 34);
        wins[i].setAttribute('x', x - 11); wins[i].setAttribute('y', y - 15);
        wins[i].setAttribute('transform', `rotate(${deg + 90} ${x} ${y})`);
        wins[i].style.opacity = prog(lt, 0.7, 0.6);
      });
      arrows.forEach((e, i) => {
        const a = (i / 8) * 2 * Math.PI + Math.PI / 8, r1 = r + 16, r2 = r + 16 + 40 * s;
        const x1 = cx + Math.cos(a) * r1, y1 = cy + Math.sin(a) * r1, x2 = cx + Math.cos(a) * r2, y2 = cy + Math.sin(a) * r2;
        const h = 12 * s, nx = Math.cos(a), ny = Math.sin(a);
        e.setAttribute('d', `M${x1} ${y1} L${x2} ${y2} M${x2 - nx * h - ny * h * .7} ${y2 - ny * h + nx * h * .7} L${x2} ${y2} L${x2 - nx * h + ny * h * .7} ${y2 - ny * h - nx * h * .7}`);
        e.style.strokeDasharray = 'none'; e.style.opacity = s * pIn;
      });
      const fast = c.fast ?? dur * 0.7;
      let n = Math.floor(run / period) + 1;
      if (lt > fast) n = Math.max(n, Math.round(lerp(n, P.count_to ?? 12000, prog(lt, fast, 2.0))));
      count.textContent = '× ' + n.toLocaleString('tr-TR');
      count.style.opacity = label.style.opacity = prog(lt, 0.9, 0.6);
    };
  },

  stress_corner(svg, P) {
    const round = P.shape === 'round';
    const x = 270, y = 130, w = 380, h = 420, R = round ? (P.radius ?? 120) : 5;
    // fuselage skin context: rivet rows
    const rivets = [
      el(svg, 'path', { d: rrect(x - 50, y - 50, w + 100, h + 100, round ? R + 50 : 10), fill: 'none', stroke: DIM, 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-dasharray': '0 24' }),
      line(svg, 'M40 40 H880', DIM, 2), line(svg, 'M40 640 H880', DIM, 2)];
    const pane = windowPane(svg, x, y, w, h, R, WHITE);
    const corners = [[x, y, -1, -1], [x + w, y, 1, -1], [x, y + h, -1, 1], [x + w, y + h, 1, 1]];
    const red = [], amber = [], cracks = [];
    // square: concentric 270° arcs piling into each corner
    for (const [px, py, sx, sy] of corners) {
      const g = el(svg, 'g'); red.push(g);
      for (let k = 0; k < 5; k++) el(g, 'path', { fill: 'none', stroke: RED, 'stroke-width': 3.5, 'stroke-linecap': 'round' });
      const glow = el(g, 'circle', { cx: px, cy: py, r: 34, fill: RED, opacity: 0 });
    }
    // round: offset lines spreading along the edges
    if (round) for (let q = 0; q < 4; q++) {
      const g = el(svg, 'g'); amber.push(g);
      for (let k = 0; k < 4; k++) el(g, 'path', { fill: 'none', stroke: AMBER, 'stroke-width': 3.5, 'stroke-linecap': 'round' });
    }
    if (!round) {
      const pts = [[0, 0], [16, -12], [26, -8], [42, -30], [58, -32], [70, -54], [92, -60], [100, -86], [122, -96]];
      cracks.push(line(svg, 'M' + pts.map(([a, b]) => `${x + w + a} ${y + b}`).join(' L'), RED, 5));
      cracks.push(line(svg, 'M' + pts.slice(0, 6).map(([a, b]) => `${x - a * .9} ${y + h - b * .9}`).join(' L'), RED, 4));
    }
    pane.forEach(e => svg.appendChild(e));

    const sqArc = (px, py, sx, sy, rho) => {
      const sw = sx * sy < 0 ? 1 : 0;
      return `M${px - sx * rho} ${py} A${rho} ${rho} 0 1 ${sw} ${px} ${py - sy * rho}`;
    };
    const rdArc = (q, off, L) => {        // offset outline around rounded corner q, extending L along both edges
      const [px, py, sx, sy] = corners[q];
      const cx = px - sx * R, cy = py - sy * R, rr = R + off, sw = sx * sy < 0 ? 1 : 0;
      return `M${cx - sx * L} ${cy + sy * rr} L${cx} ${cy + sy * rr} A${rr} ${rr} 0 0 ${sw} ${cx + sx * rr} ${cy} L${cx + sx * rr} ${cy - sy * L}`;
    };

    return (lt, dur, c) => {
      const pIn = prog(lt, 0.1, 1.0);
      draw(pane[0], pIn); draw(pane[1], prog(lt, 0.4, 0.9));
      rivets.forEach(e => e.style.opacity = 0.9 * prog(lt, 0.2, 1.0));

  timeline(svg, P) {

    return (lt, dur, c) => {

      let px = x0;
      items.forEach((it, i) => {

  stress_flow(svg, P) {

    });

  // side-view suspension bridge. params: mode calm|wave|twist|collapse, wind, cars
  // cues: start (motion grows from here), collapse
  bridge(svg, P) {
    const mode = P.mode || 'calm', DY = 420, T1 = 250, T2 = 670, TOP = 150, X0 = 40, X1 = 880;
    const water = [0, 1].map(i => line(svg, '', DIM, 3));

    const cable = el(svg, 'path', { fill: 'none', stroke: WHITE, 'stroke-width': 3.5 });
    const hangers = el(svg, 'path', { fill: 'none', stroke: GRAY, 'stroke-width': 1.6 });
    const deckFar = el(svg, 'path', { fill: 'none', stroke: GRAY, 'stroke-width': 4, 'stroke-linejoin': 'round' });
    const deck = el(svg, 'path', { fill: 'none', stroke: AMBER, 'stroke-width': 6, 'stroke-linejoin': 'round' });
    const cars = (P.cars ? [0.18, 0.46, 0.7] : []).map(() => el(svg, 'rect', { width: 34, height: 16, rx: 5, fill: WHITE }));
    const piece = el(svg, 'g');
    const pieceFar = el(piece, 'path', { fill: 'none', stroke: GRAY, 'stroke-width': 4 });
    const pieceN = el(piece, 'path', { fill: 'none', stroke: AMBER, 'stroke-width': 6 });
    const r = rng(5), debris = [];
    for (let i = 0; i < 10; i++) debris.push({ e: el(svg, 'path', { d: `M0 0 l${18 + r() * 30} ${r() * 10 - 5}`, stroke: AMBER, 'stroke-width': 5, 'stroke-linecap': 'round', opacity: 0 }), x: 340 + r() * 240, v: r() });
    const splash = el(svg, 'path', { fill: 'none', stroke: 'rgba(200,220,240,.6)', 'stroke-width': 3, 'stroke-linecap': 'round', opacity: 0 });
    // standing-wave shape between supports
    const shape = (x, n) => {
      if (x < T1) return Math.sin(Math.PI * (x - X0) / (T1 - X0)) * 0.5;
      if (x > T2) return Math.sin(Math.PI * (x - T2) / (X1 - T2)) * 0.5;
      return Math.sin(Math.PI * n * (x - T1) / (T2 - T1));
    };

      if (x < T1) return lerp(DY - 10, TOP, (x - X0) / (T1 - X0));
      if (x > T2) return lerp(TOP, DY - 10, (x - T2) / (X1 - T2));

      const st = c.start ?? 0.6;
      const grow = mode === 'calm' ? 0.05 : prog(lt, st - 0.5, 2.5);
      const A = (mode === 'wave' ? 26 : mode === 'twist' || mode === 'collapse' ? 34 : 3) * grow * (P.amp ?? 1);

        else { const tw = A * shape(x, 1) * Math.sin(w); yN = DY + tw; yF = DY - 10 - tw; }
        ptsN.push([x, yN, inGap]); ptsF.push([x, yF, inGap]);
      }
      const path = pts => { let d = '', pen = false; for (const [x, y, gap] of pts) { if (gap && fall > 0.02) { pen = false; continue; } d += (pen ? 'L' : 'M') + x + ' ' + y.toFixed(1) + ' '; pen = true; } return d; };
      deck.setAttribute('d', path(ptsN)); deckFar.setAttribute('d', path(ptsF));
      // the torn-off centre span drops, tilts and sinks
      const gapPath = pts => pts.filter(p => p[2]).map(([x, y], i) => (i ? 'L' : 'M') + x + ' ' + y.toFixed(1)).join(' ');
      if (fall > 0.02) {
        pieceN.setAttribute('d', gapPath(ptsN)); pieceFar.setAttribute('d', gapPath(ptsF));
        piece.setAttribute('transform', `translate(0 ${fall * fall * 190}) rotate(${fall * 14} 460 ${DY})`);

      let dc = '';
      for (let x = X0; x <= X1; x += 10) dc += (x === X0 ? 'M' : 'L') + x + ' ' + cableY(x, sag).toFixed(1) + ' ';
      cable.setAttribute('d', dc); cable.style.opacity = pIn;
      let dh = '';
      ptsN.forEach(([x, y, gap], i) => { if (i % 2 || x <= T1 + 5 && x >= T1 - 5 || x <= T2 + 5 && x >= T2 - 5) return; if (gap && fall > 0.02) return; const cy = cableY(x, sag); if (y - cy > 12) dh += `M${x} ${cy.toFixed(1)} L${x} ${y.toFixed(1)} `; });
      hangers.setAttribute('d', dh); hangers.style.opacity = prog(lt, 0.6, 0.8) * 0.9;

    const horizon = line(inner, `M${x} ${y + h * 0.66} H${x + w}`, AMBER, 3);
    const clouds = [line(inner, '', GRAY, 3), line(inner, '', GRAY, 3)];
    const pane = windowPane(svg, x, y, w, h, R, WHITE);
    return (lt, dur) => {
      draw(pane[0], prog(lt, 0.1, 1.1)); draw(pane[1], prog(lt, 0.4, 1.0));
      sky.setAttribute('opacity', prog(lt, 0.6, 1.4));
      draw(horizon, prog(lt, 0.8, 1.2));
      [[y + 160, 0], [y + 230, 1]].forEach(([cy, i]) => {
        const off = ((lt * 22 + i * 140) % (w + 200)) - 100;
        clouds[i].setAttribute('d', `M${x + off} ${cy} h${90 - i * 30}`);
        clouds[i].style.opacity = prog(lt, 1.0 + i * 0.2, 0.8) * 0.8;
      });
    };
  },

  question(svg) {
    const bubble = line(svg, rrect(210, 110, 500, 360, 60) + '', WHITE, 5);
    const tail = line(svg, 'M330 470 L300 560 L410 470', WHITE, 5);
    const q = el(svg, 'text', { x: 460, y: 352, fill: AMBER, 'font-size': 220, 'font-weight': 800, 'text-anchor': 'middle' });
    q.textContent = '?';
    const bars = [0, 1, 2].map(i => el(svg, 'rect', { x: 560 + i * 0, y: 0, width: 0, height: 14, rx: 7, fill: DIM }));
    return (lt, dur) => {
      draw(bubble, prog(lt, 0.1, 1.1)); draw(tail, prog(lt, 0.7, 0.6));
      const p = prog(lt, 0.6, 0.9);
      q.style.opacity = p;
      q.setAttribute('transform', `translate(0 ${(1 - p) * 30})`);
      bars.forEach((b, i) => {
        const pb = prog(lt, 1.2 + i * 0.25, 0.8);
        b.setAttribute('x', 740); b.setAttribute('y', 520 + i * 32);
        b.setAttribute('width', pb * [120, 90, 60][i]);
        b.style.opacity = pb;
      });
    };
  },
};

// side-view airliner; breakup splits it along a jagged line using two clipPaths
let planeId = 0;
function buildPlane(svg, P, breakup) {
  const id = 'pl' + (planeId++);
  const nWin = P.windows ?? 9, sq = (P.window_shape ?? 'square') === 'square';
  const split = P.split_x ?? 520;
  const defs = el(svg, 'defs');
  const zig = [[split - 6, 250], [split + 8, 290], [split - 8, 322], [split + 10, 350], [split - 4, 380], [split + 6, 420]];
  const zz = zig.map(([a, b]) => `${a} ${b}`).join(' L');
  el(el(defs, 'clipPath', { id: id + 'a' }), 'path', { d: `M0 0 H${split} L${zz} L${split} 680 H0 Z` });
  el(el(defs, 'clipPath', { id: id + 'b' }), 'path', { d: `M920 0 H${split} L${zz} L${split} 680 H920 Z` });

  const world = el(svg, 'g');
  const halves = breakup ? [el(world, 'g', { 'clip-path': `url(#${id}a)` }), el(world, 'g', { 'clip-path': `url(#${id}b)` })] : [el(world, 'g')];
  const parts = halves.map(h => {
    const g = el(h, 'g');
    const body = line(g, 'M150 300 L680 300 C760 300 812 320 832 342 C812 362 760 374 680 374 L250 374 C200 374 168 350 150 300 Z', WHITE, 5);
    const fin = line(g, 'M156 302 L118 196 L164 196 L238 300', WHITE, 5);
    const stab = line(g, 'M178 338 L100 356 L186 352', GRAY, 3.5);
    const wing = line(g, 'M470 368 L360 456 L408 458 L560 372', GRAY, 4);
    const cockpit = line(g, 'M772 318 L796 318 L808 330 L784 330 Z', GRAY, 3);
    const wins = [];
    for (let i = 0; i < nWin; i++) {
      const wx = 290 + i * 46;
      wins.push(el(g, 'rect', { x: wx, y: 318, width: 22, height: 24, rx: sq ? 2 : 9, fill: 'none', stroke: AMBER, 'stroke-width': 3 }));
    }
    return { strokes: [body, fin, stab, wing, cockpit], wins };
  });
  // speed lines
  const speed = [0, 1, 2, 3].map(() => line(svg, '', DIM, 3));
  // magnifier lens on one window (plane scene)
  let lens = null;
  if (!breakup) {
    const g = el(svg, 'g');
    const lx = 690, ly = 150, lr = 108;
    const conn = line(g, `M${336 + 11} 318 L${lx - lr * 0.8} ${ly + lr * 0.6}`, GRAY, 2);
    const circ = el(g, 'circle', { cx: lx, cy: ly, r: lr, fill: '#141416', stroke: GRAY, 'stroke-width': 3 });
    const big = el(g, 'rect', { x: lx - 46, y: ly - 52, width: 92, height: 104, rx: sq ? 4 : 34, fill: 'none', stroke: AMBER, 'stroke-width': 6 });
    lens = { g, conn };
  }
  // breakup extras
  const debris = [], r = rng(7);
  let crackLine = null;
  let stamp = null;
  if (breakup && P.stamp) {
    stamp = el(svg, 'g');
    el(stamp, 'rect', { x: 250, y: 470, width: 420, height: 104, rx: 14, fill: 'rgba(229,72,77,0.08)', stroke: RED, 'stroke-width': 5 });
    const tx = el(stamp, 'text', { x: 460, y: 540, fill: RED, 'font-size': 52, 'font-weight': 800, 'text-anchor': 'middle', 'letter-spacing': '0.06em' });
    tx.textContent = P.stamp;
  }
  if (breakup) {
    crackLine = line(svg, `M${zz}`, RED, 4);
    for (let i = 0; i < 12; i++) debris.push({ e: line(svg, `M0 0 l${6 + r() * 10} ${r() * 8 - 4}`, GRAY, 3), a: r() * Math.PI * 2, v: 60 + r() * 120, s: r() * 360 });
  }

  return (lt, dur, c) => {
    const bob = Math.sin(lt * 1.6) * 4;
    const drift = breakup ? 0 : lerp(-30, 30, lt / Math.max(dur, 1));
    world.setAttribute('transform', `translate(${drift} ${bob})`);
    const drawT = breakup ? 0.5 : 1.1;
    parts.forEach(pt => {
      pt.strokes.forEach((e, i) => draw(e, prog(lt, 0.05 + i * 0.12, drawT)));
      pt.wins.forEach((w, i) => {
        const p = prog(lt, (breakup ? 0.3 : 0.8) + i * 0.06, 0.5);
        w.style.opacity = p;
        const cx = 290 + i * 46 + 11, cy = 330, s = lerp(0.4, 1, p);
        w.setAttribute('transform', `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`);
      });
    });
    speed.forEach((e, i) => {
      const yy = 260 + i * 50, len = 70 + i * 25, x0 = 90 - ((lt * 260 + i * 97) % 260);
      e.setAttribute('d', `M${x0 + drift} ${yy + bob} h${-len}`);
      e.style.strokeDasharray = 'none';
      e.style.opacity = (breakup ? 1 - prog(lt, (c.break ?? dur * 0.6), 0.4) : 1) * prog(lt, 0.6, 0.8) * 0.8;
    });
    if (lens) {
      const L = c.lens ?? dur * 0.65, p = prog(lt, L - 0.2, 0.8);
      lens.g.style.opacity = p;
      lens.g.setAttribute('transform', `translate(${690 * (1 - lerp(0.85, 1, p))} ${150 * (1 - lerp(0.85, 1, p))}) scale(${lerp(0.85, 1, p)})`);
      draw(lens.conn, p);
    }
    if (breakup) {
      const B = c.break ?? dur * 0.6;
      draw(crackLine, prog(lt, B - 1.0, 0.9));
      crackLine.style.opacity = (prog(lt, B - 1.0, 0.3)) * (1 - prog(lt, B + 0.2, 0.5));
      const p = prog(lt, B, 1.3);
      halves[0].setAttribute('transform', `translate(${-60 * p} ${50 * p}) rotate(${-9 * p} ${split} 340)`);
      halves[1].setAttribute('transform', `translate(${55 * p} ${75 * p}) rotate(${12 * p} ${split} 340)`);
      if (stamp) {
        const ps = prog(lt, c.stamp ?? dur * 0.75, 0.45);
        stamp.style.opacity = ps;
        stamp.setAttribute('transform', `translate(460 522) rotate(-6) scale(${lerp(1.5, 1, ps)}) translate(-460 -522)`);
      }
      const k = lin(lt, B, 1.3);
      debris.forEach(d => {
        const dist = d.v * EASE(k);
        d.e.setAttribute('transform', `translate(${split + Math.cos(d.a) * dist} ${340 + Math.sin(d.a) * dist + 40 * k * k}) rotate(${d.s + 200 * k})`);
        d.e.style.strokeDasharray = 'none';
        d.e.style.opacity = k > 0 ? Math.min(1, k * 6) * (1 - k * 0.6) : 0;
      });
    }
  };
}

// ------------------------------------------------------------ timeline
let D, S = [];
window.init = (data) => {
  D = data;
  document.documentElement.classList.add(D.format || 'short');
  document.querySelector('#brand span').textContent = D.channel || '';
  // ambient dust particles (deterministic)
  const pr = rng(99), pbox = document.getElementById('particles');
  window.PARTS = Array.from({ length: 38 }, () => {
    const e = document.createElement('i'), sz = 2 + pr() * 4;
    e.style.width = e.style.height = sz + 'px'; pbox.appendChild(e);
    return { e, x: pr(), y: pr(), v: 8 + pr() * 22, ph: pr() * 6.28, a: 0.08 + pr() * 0.25 };
  });
  const fl = document.createElement('div'); fl.id = 'flash'; document.getElementById('card').appendChild(fl);
  const titles = document.getElementById('titles'), tagrows = document.getElementById('tagrows'), card = document.getElementById('card');
  S = D.scenes.map((sc) => {
    const t = document.createElement('div'); t.className = 'title';
    const words = [];
    for (const [cls, txt] of [['w', sc.title.white || ''], ['g', sc.title.gray || '']])
      for (const wd of txt.split(/\s+/).filter(Boolean)) {
        const s = document.createElement('span'); s.className = cls; s.textContent = wd; t.appendChild(s); words.push(s);
      }
    titles.appendChild(t);
    const tg = document.createElement('div'); tg.className = 'tags';
    const tags = sc.tags.map(x => { const d = document.createElement('div'); d.className = 'tag'; d.textContent = x; tg.appendChild(d); return d; });
    tagrows.appendChild(tg);
    const svg = el(card, 'svg', { viewBox: '0 0 920 680' });
    const update = BUILD[sc.type](svg, sc.params || {});
    return { sc, t, words, tg, tags, svg, update };
  });
  window.seek(0);
};

// Thumbnail: big text + one scene's illustration frozen at a chosen moment.
// c = {lines: ["UÇAK PENCERELERİ", "NEDEN KARE DEĞİL?"], highlight: ["KARE"], scene: 0, t: 4.0}
window.cover = (c) => {
  const sc = D.scenes[Math.min(c.scene ?? 0, D.scenes.length - 1)];
  const dur = sc.end - sc.start;
  window.seek(sc.start + Math.min(c.t ?? dur * 0.85, dur - 0.35));
  // seek() toggles the hook classes; set the thumbnail state after it
  document.documentElement.classList.remove('hook');
  document.documentElement.classList.add('cover');
  document.getElementById('covertext').style.transform = '';
  const box = buildCoverText(c);
  if (D.format !== 'long') {   // keep the card clear of the text block
    const bottom = box.getBoundingClientRect().bottom;
    document.getElementById('card').style.top = Math.max(860, Math.min(1180, bottom + 50)) + 'px';
  }
  drawCoverMark(c);
};

function buildCoverText(c) {
  const hl = (c.highlight || []).map(w => w.toLocaleUpperCase('tr-TR'));
  const box = document.getElementById('covertext');
  box.innerHTML = '';
  for (const ln of c.lines || []) {
    const row = document.createElement('span'); row.className = 'line';
    for (const w of ln.split(/\s+/)) {
      const sp = document.createElement('span');
      sp.textContent = w + ' ';
      if (hl.includes(w.toLocaleUpperCase('tr-TR').replace(/[?!.,:]/g, ''))) sp.className = 'hl';
      row.appendChild(sp);
    }
    box.appendChild(row);
  }
  // shrink the type until the longest line fits (long Turkish words)
  box.style.fontSize = '';
  let fs = parseFloat(getComputedStyle(box).fontSize);
  while (fs > 70 && [...box.querySelectorAll('.line')].some(l => l.scrollWidth > box.clientWidth + 2 || l.offsetHeight > fs * 1.6)) {
    fs -= 6; box.style.fontSize = fs + 'px';
  }
  return box;
}

function drawCoverMark(c) {
  const mk = document.getElementById('covermark');
  mk.innerHTML = '';
  if (c.mark && D.format === 'long') {
    // scene svg (920x680) sits in the 1.5x-scaled card at left 880, top 200 (scale origin = card centre)
    const k = 1.5, cx0 = 880 + 460, cy0 = 200 + 340;
    const x = cx0 + (c.mark.x - 460) * k, y = cy0 + (c.mark.y - 340) * k, r = (c.mark.r ?? 60) * k;
    const g = el(mk, 'g', { style: 'filter: drop-shadow(0 0 14px rgba(229,72,77,.8))' });
    el(g, 'circle', { cx: x, cy: y, r, fill: 'none', stroke: RED, 'stroke-width': 12 });
    const ax = x - r * 0.75 - 170, ay = y + r * 0.75 + 150, bx = x - r * 0.78, by = y + r * 0.78;
    el(g, 'path', { d: `M${ax} ${ay} Q${ax + 30} ${by + 20} ${bx - 14} ${by + 14}`, fill: 'none', stroke: RED, 'stroke-width': 12, 'stroke-linecap': 'round' });
    const ang = Math.atan2(by + 14 - (by + 20), bx - 14 - (ax + 30));
    const hx = bx - 6, hy = by + 6, L = 44;
    el(g, 'path', { d: `M${hx - L * Math.cos(ang - 0.5)} ${hy - L * Math.sin(ang - 0.5)} L${hx} ${hy} L${hx - L * Math.cos(ang + 0.5)} ${hy - L * Math.sin(ang + 0.5)}`, fill: 'none', stroke: RED, 'stroke-width': 12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  }
};

// Shorts open on a ready-made hook frame (big text + the most dramatic illustration moment),
// so the very first frame in the feed is already "full". It cuts to the normal layout when
// the first sentence ends (D.hook.end).
window.seek = (t) => {
  const h = D.hook, root = document.documentElement, card = document.getElementById('card');
  if (h && t < h.end) {
    if (!root.classList.contains('cover')) { root.classList.add('cover', 'hook'); buildCoverText(h); }
    const sc = D.scenes[Math.min(h.scene ?? 0, D.scenes.length - 1)], dur = sc.end - sc.start;
    renderAt(Math.min(sc.start + Math.min(h.t ?? dur * 0.85, dur - 0.35) + t * 0.5, sc.end - 0.3));
    const box = document.getElementById('covertext');
    box.style.transform = `scale(${lerp(1.06, 1, prog(t, 0, 0.35))})`;
    box.style.transformOrigin = 'left top';
    card.style.top = Math.max(860, Math.min(1180, box.getBoundingClientRect().bottom + 50)) + 'px';
    card.style.setProperty('transform', `scale(${lerp(1.04, 1.1, t / h.end)})`, 'important');
    return;
  }
  if (root.classList.contains('hook')) { root.classList.remove('cover', 'hook'); card.style.top = ''; card.style.removeProperty('transform'); }
  renderAt(t);
};

function renderAt(t) {
  const last = S.length - 1;
  S.forEach((o, i) => {
    const { sc } = o;
    const live = t >= sc.start - 0.001 && t < sc.end + 0.4;
    for (const node of [o.t, o.tg, o.svg]) node.style.display = live ? '' : 'none';
    if (!live) return;
    const lt = t - sc.start, dur = sc.end - sc.start;
    const out = i === last ? 1 : 1 - prog(t, sc.end - 0.16, 0.18);
    o.words.forEach((w, k) => {
      const p = spring(t, sc.start + 0.02 + k * 0.045, 0.6);
      w.style.opacity = clamp01(p * 1.6) * out;
      w.style.transform = `translateY(${(1 - p) * 56 - (1 - out) * 16}px) scale(${lerp(0.82, 1, p)})`;
    });
    o.tags.forEach((g, k) => {
      const p = spring(t, sc.start + 0.2 + k * 0.08, 0.55);
      g.style.opacity = clamp01(p * 1.5) * out;
      g.style.transform = `translateY(${(1 - p) * 22}px) scale(${lerp(0.7, 1, p)})`;
    });
    const cues = {};
    for (const k in sc.cues) cues[k] = sc.cues[k] - sc.start;
    // varied entrance per scene + camera: slow push, punch-in & shake on cue words
    const kind = i === 0 ? 'zoom' : ['slide', 'zoom', 'rise', 'wipe'][i % 4];
    const pi = prog(t, sc.start, 0.32), ps = spring(t, sc.start, 0.6);
    let pk = 0; for (const k in cues) pk = Math.max(pk, punch(lt, cues[k]));
    o.pk = pk;
    const z = (kind === 'zoom' ? lerp(1.22, 1, pi) : lerp(1.05, 1, pi)) * lerp(1, 1.07, lt / Math.max(dur, 1)) * (1 + 0.05 * pk) * lerp(0.94, 1, out);
    const sx = (kind === 'slide' ? (1 - ps) * 160 : 0) - (1 - out) * 60 + Math.sin(lt * 70) * 7 * pk;
    const sy = (kind === 'rise' ? (1 - ps) * 140 : 0) + Math.sin(t * 0.9) * 6 + Math.cos(lt * 63) * 5 * pk;
    o.svg.style.opacity = (kind === 'wipe' ? 1 : pi) * out;
    o.svg.style.clipPath = kind === 'wipe' && pi < 1 ? `inset(0 ${(1 - pi) * 100}% 0 0)` : 'none';
    const cam = (sc.params || {}).camera;
    if (cam) o.svg.style.transformOrigin = `${(cam.x ?? 460) / 9.2}% ${(cam.y ?? 340) / 6.8}%`;
    const cz = cam ? lerp(1, cam.zoom ?? 1.6, cam.push ? prog(lt, 0, dur) : 1) : 1;
    o.svg.style.transform = `translate(${sx}px, ${sy}px) scale(${z * cz}) rotate(${Math.sin(lt * 55) * 0.6 * pk}deg)`;
    o.update(lt, dur, cues);
  });

  const fl = document.getElementById('flash');
  fl.style.opacity = Math.max(0, ...S.map(o => (t >= o.sc.start && t < o.sc.end ? o.pk || 0 : 0))) * 0.45;
  (window.PARTS || []).forEach(q => {
    const y = ((q.y * 1.1 - t * q.v / 1000 * 1.0) % 1.1 + 1.1) % 1.1 - 0.05;
    q.e.style.transform = `translate(${(q.x + Math.sin(t * 0.4 + q.ph) * 0.015) * 100}vw, ${y * 100}vh)`;
    q.e.style.opacity = q.a * (0.6 + 0.4 * Math.sin(t * 1.3 + q.ph));
  });
  const card = document.getElementById('card'), pc = D.hook ? 1 : prog(t, 0, 0.6);
  card.style.opacity = pc;
  card.style.transform = `scale(${lerp(0.97, 1, pc)})`;

  const stage = document.getElementById('stage'), lx = 50 + Math.sin(t * 0.35) * 8, ly = 40 + Math.cos(t * 0.27) * 5;
  stage.style.background = `radial-gradient(ellipse 950px 850px at ${lx}% ${ly}%, rgba(255,255,255,${0.045 + 0.015 * Math.sin(t * 0.6)}), rgba(255,255,255,0) 70%), #0a0a0b`;
  const brand = document.getElementById('brand');
  brand.style.opacity = D.hook ? 1 : prog(t, 0.2, 0.8);
  brand.querySelector('i').style.transform = `scale(${1 + 0.18 * Math.sin(t * 2.2)})`;

  const cap = document.getElementById('caption');
  const c = D.captions.find(c => t >= c.start && t < c.end);
  if (c) {
    if (cap._c !== c) {
      cap._c = c;
      cap.innerHTML = '';
      c.spans = c.words.map(w => { const s = document.createElement('span'); s.textContent = w.text; cap.appendChild(s); return s; });
    }
    c.words.forEach((w, k) => {
      const next = k + 1 < c.words.length ? c.words[k + 1].t : c.end;
      const on = t >= w.t, now = on && t < next;
      c.spans[k].style.color = now ? 'var(--amber)' : (on ? 'var(--white)' : 'rgba(245,245,247,.45)');
      c.spans[k].style.transform = now ? `scale(${1.03 + 0.07 * Math.exp(-(t - w.t) * 9)})` : "scale(1)";
    });
    const pin = spring(t, c.start, 0.4), pout = 1 - prog(t, c.end - 0.1, 0.1);
    cap.style.opacity = clamp01(pin * 1.6) * pout;
    cap.style.transform = `translateY(${(1 - pin) * 26}px) scale(${lerp(0.9, 1, pin)})`;
  } else cap.style.opacity = 0;

  document.getElementById('bar').style.width = (100 * clamp01(t / D.duration)) + '%';
}
</script>
