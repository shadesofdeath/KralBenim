<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!-- Studio engine: full-bleed shots (2D SVG + Three.js 3D), per-video art direction, mascot,
     word-by-word captions. Time is driven only by window.seek(t) (deterministic). -->
<style>
  @font-face { font-family: Anton; src: url(fonts/anton-latin.woff2) format('woff2'); font-display: block;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Anton; src: url(fonts/anton-latin-ext.woff2) format('woff2'); font-display: block;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  :root { --W: 1080px; --H: 1920px; --accent: #d9a441; --ink: #f5f5f7; }
  html, body { margin: 0; width: var(--W); height: var(--H); overflow: hidden; background: #000; }
  html.long { --W: 1920px; --H: 1080px; }
  body { font-family: Inter, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: var(--W); height: var(--H); overflow: hidden; background: #000; }
  #stage > * { position: absolute; inset: 0; }
  canvas { display: block; }
  #bg, #gl { width: var(--W); height: var(--H); }
  #shots > svg { position: absolute; left: 0; top: 0; overflow: visible; }
  #labels { pointer-events: none; }
  #labels svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .lbl { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; text-align: center;
    font-weight: 800; letter-spacing: -0.01em; text-shadow: 0 3px 18px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.9); }
  .lbl b { display: block; font-family: Anton, Inter, sans-serif; font-weight: 400; letter-spacing: .01em; }
  .lbl small { display: block; font-weight: 600; opacity: .78; }

  #vignette { background: radial-gradient(ellipse 80% 70% at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,.62) 100%); }
  #flash { opacity: 0; background: #fff; }

  /* ---- HUD */
  #brand { inset: auto; left: 64px; top: 92px; display: flex; align-items: center; gap: 14px;
    font-size: 34px; font-weight: 700; letter-spacing: -0.01em; text-shadow: 0 2px 14px rgba(0,0,0,.7); }
  #brand i { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); display: block;
    box-shadow: 0 0 14px var(--accent); }
  .kicker { position: absolute; left: 64px; top: 168px; display: flex; align-items: stretch; gap: 18px;
    font-size: 52px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; max-width: 720px;
    text-shadow: 0 3px 22px rgba(0,0,0,.75); }
  .kicker .bar { width: 8px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 18px var(--accent); flex: none; }
  .kicker .g { color: rgba(245,245,247,.62); }
  .kicker span.wd { display: inline-block; margin-right: .22em; }
  #caption { inset: auto; left: 60px; right: 60px; top: 1170px; text-align: center;
    font-size: 92px; font-weight: 900; line-height: 1.08; letter-spacing: -0.03em; }
  #caption span { display: inline-block; margin: 0 .13em; transform-origin: 50% 70%;
    paint-order: stroke fill; -webkit-text-stroke: 14px rgba(0,0,0,.88);
    text-shadow: 0 8px 30px rgba(0,0,0,.65); }
  #mascot { inset: auto; width: 300px; height: 300px; left: 0; top: 0; overflow: visible; }
  #progress { display: none; }

  html.long #brand { left: 90px; top: 64px; }
  html.long .kicker { left: 90px; top: 128px; font-size: 46px; max-width: 900px; }
  html.long #caption { left: 200px; right: 200px; top: auto; bottom: 92px; font-size: 64px; }
  html.long #caption span { -webkit-text-stroke: 10px rgba(0,0,0,.88); }
  html.long #progress { display: block; inset: auto; left: 90px; right: 90px; bottom: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); }
  html.long #bar { height: 100%; width: 0; border-radius: 3px; background: var(--accent); }

  /* ---- cover / hook */
  #covershade, #covertext { display: none; }
  html.cover #covershade { display: block;
    background: linear-gradient(180deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,.55) 30%, rgba(0,0,0,0) 52%); }
  html.cover #covertext { display: block; inset: auto; left: 70px; right: 70px; top: 190px;
    font-family: Anton, Inter, sans-serif; font-size: 178px; line-height: 1.02; letter-spacing: .005em;
    text-transform: uppercase; text-shadow: 0 10px 50px rgba(0,0,0,.7); transform-origin: left top; }
  html.cover #covertext .line { display: block; }
  html.cover #covertext .hl { color: #111; background: var(--accent); padding: .02em .12em 0; margin: .04em .1em .06em 0;
    border-radius: .06em; display: inline-block; transform: rotate(-2deg); text-shadow: none;
    box-shadow: 0 .05em .4em rgba(0,0,0,.45); }
  html.cover .kicker, html.cover #caption, html.cover #progress { display: none !important; }
  html.long.cover #covershade { background: linear-gradient(90deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.7) 34%, rgba(0,0,0,0) 60%); }
  html.long.cover #covertext { left: 90px; right: auto; width: 860px; top: 50%; transform: translateY(-50%); font-size: 150px; }
  html.long.cover #brand { font-size: 38px; }
</style>
<script src="../vendor/gsap.min.js"></script>
<script src="../vendor/three.min.js"></script>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="gl"></canvas>
  <div id="shots"></div>
  <div id="labels"></div>
  <div id="leak"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="kickers"></div>
  <div id="caption"></div>
  <svg id="mascot" viewBox="-150 -150 300 300"></svg>
  <div id="covershade"></div>
  <div id="covertext"></div>
  <div id="brand"><i></i><span></span></div>
  <div id="progress"><div id="bar"></div></div>
</div>
<script src="core.js"></script>
<script src="mascot.js"></script>
<script src="shots2d.js"></script>
<script src="shots3d.js"></script>
<script src="engine.js"></script>
</body>
</html>
