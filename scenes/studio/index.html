<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!-- Studio engine, one style: sepia parchment + Kaşif (brand/kit/BRAND.md). Full-bleed ink shots
     (scenes/studio/shots/<type>.js, loaded by build.py), word-by-word captions. Time is driven only by
     window.seek(t) (deterministic). -->
<style>
  @font-face { font-family: Fraunces; src: url(fonts/fraunces-latin.woff2) format('woff2'); font-weight: 100 900; font-display: block;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Fraunces; src: url(fonts/fraunces-latin-ext.woff2) format('woff2'); font-weight: 100 900; font-display: block;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: Lora; src: url(fonts/lora-latin.woff2) format('woff2'); font-weight: 400 700; font-display: block;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Lora; src: url(fonts/lora-latin-ext.woff2) format('woff2'); font-weight: 400 700; font-display: block;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Patrick Hand'; src: url(fonts/patrick-hand-latin.woff2) format('woff2'); font-weight: 400; font-display: block;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Patrick Hand'; src: url(fonts/patrick-hand-latin-ext.woff2) format('woff2'); font-weight: 400; font-display: block;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Zilla Slab'; src: url(fonts/zilla-slab-600-latin.woff2) format('woff2'); font-weight: 600; font-display: block;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Zilla Slab'; src: url(fonts/zilla-slab-600-latin-ext.woff2) format('woff2'); font-weight: 600; font-display: block;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Zilla Slab'; src: url(fonts/zilla-slab-700-latin.woff2) format('woff2'); font-weight: 700; font-display: block;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Zilla Slab'; src: url(fonts/zilla-slab-700-latin-ext.woff2) format('woff2'); font-weight: 700; font-display: block;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  /* one visual style: sepia parchment + Kaşif (brand/kit/BRAND.md §3-5) */
  :root { --W: 1080px; --H: 1920px; }
  html, body { margin: 0; width: var(--W); height: var(--H); overflow: hidden; background: var(--paper, #E9DCC0); }
  html.long { --W: 1920px; --H: 1080px; }
  body { font-family: Lora, serif; color: var(--ink, #2B1D12); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: var(--W); height: var(--H); overflow: hidden; background: var(--paper, #E9DCC0); }
  #stage > * { position: absolute; inset: 0; }
  canvas { display: block; }
  #bg { width: var(--W); height: var(--H); }
  #shots > svg { position: absolute; left: 0; top: 0; overflow: visible; }

  /* ---- HUD (kicker, captions and brand are drawn by parchment-theme.js into #kickers) */
  #progress { display: none; }
  html.long #progress { display: block; inset: auto; left: 90px; right: 90px; bottom: 40px; height: 5px; border-radius: 3px; background: rgba(43,29,18,.15); }
  html.long #bar { height: 100%; width: 0; border-radius: 3px; background: var(--blue, #4A6F94); }

  /* ---- cover / hook (BRAND.md §9) */
  #covershade, #covertext, #kasifcover, #coverfade, #coverframe { display: none; pointer-events: none; }
  /* long video thumbnail with cover.focus: everything but the focal object fades into the paper (one clear subject) */
  html.long.cover.focus #coverfade { display: block; background: radial-gradient(ellipse 30% 50% at 72% 52%, transparent 58%, var(--paper, #E9DCC0) 100%); }
  html.cover #covershade { display: block; background: linear-gradient(180deg, var(--paper, #E9DCC0) 0%, var(--paper, #E9DCC0) 36%, transparent 50%); }
  html.long.cover #covershade { background: linear-gradient(90deg, var(--paper, #E9DCC0) 0%, var(--paper, #E9DCC0) 38%, transparent 56%); }
  html.cover #covertext { display: block; inset: auto; left: 84px; right: 84px; top: 190px;
    font-family: Fraunces, serif; font-weight: 900; color: var(--ink, #2B1D12); font-size: 150px; line-height: 1.04; letter-spacing: -0.02em; word-spacing: 0.14em;
    text-transform: uppercase; transform-origin: left top; }
  html.cover #covertext .line { display: block; }
  html.cover #covertext .hl { color: var(--paperLight, #F4EAD5); background: var(--red, #A8432F); padding: .02em .14em .08em; margin: .04em .1em .06em 0;
    border: 5px solid var(--ink, #2B1D12); border-radius: .12em; display: inline-block; transform: rotate(-2deg);
    box-shadow: 8px 10px 0 rgba(43,29,18,.22); }
  html.cover #progress { display: none !important; }
  html.long.cover #covertext { left: 90px; right: auto; width: 860px; top: 50%; transform: translateY(-50%); font-size: 128px; }
  html.cover #kasifcover { display: block; }
  /* thumbnail frame (owner, 2026-10-26: click-through): a bold border that stands out in the feed; thumbnail only, never
     in video frames (the Short's hook shows the cover without it). Düşün Bakalım red + ink rule, Stickstory ink + gold rule. */
  html.cover:not(.hook) #coverframe { display: block; border: 30px solid var(--red, #A8432F);
    box-shadow: inset 0 0 0 8px var(--ink, #2B1D12), inset 0 0 0 16px var(--paperLight, #F4EAD5), inset 0 0 0 20px var(--ink, #2B1D12); }
  html.long.cover:not(.hook) #coverframe { border-width: 26px; }
  html.ch-ag.cover:not(.hook) #coverframe { border-color: var(--ink, #1B2230);
    box-shadow: inset 0 0 0 10px var(--gold, #D69A2D), inset 0 0 0 16px var(--ink, #1B2230); }
  /* Stickstory's cover type (BRAND.md §11): slab caps, a flat gold-on-ink highlight, no tilt */
  html.ch-ag.cover #covertext { font-family: 'Zilla Slab', Georgia, serif; font-weight: 700; letter-spacing: 0; word-spacing: 0.08em; line-height: 0.98; }
  html.ch-ag.cover #covertext .hl { color: var(--paperLight, #F0EFEA); background: var(--ink, #1B2230); border: 0; border-radius: 4px; transform: none;
    box-shadow: 12px 12px 0 var(--red, #C4562B); padding: .04em .16em .08em; }
  /* ---- belgesel (documentary) style, docs/BELGESEL.md: no progress bar, no frame, a clean typographic cover */
  html.belgesel #progress, html.belgesel #coverframe { display: none !important; }
  html.belgesel.cover #covertext { font-family: Fraunces, serif; font-weight: 700; letter-spacing: 0.01em; word-spacing: 0.1em; line-height: 1.02;
    color: var(--ink); text-shadow: 0 4px 30px var(--paper); }
  html.belgesel.cover #covertext .hl { color: var(--gold); background: none; border: 0; padding: 0; margin: 0; transform: none; box-shadow: none; display: inline; }
  html.belgesel.long.cover #covershade { background: linear-gradient(90deg, var(--paper) 0%, var(--paper) 30%, transparent 58%); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="shots"></div>
  <div id="kickers"></div>
  <div id="coverfade"></div>
  <div id="covershade"></div>
  <div id="covertext"></div>
  <svg id="kasifcover"></svg>
  <div id="coverframe"></div>
  <div id="progress"><div id="bar"></div></div>
</div>
<script src="core.js"></script>
<script src="parchment-theme.js"></script>
<script src="sets.js"></script>
<script src="belgesel-theme.js"></script>
<script src="engine.js"></script>
</body>
</html>
