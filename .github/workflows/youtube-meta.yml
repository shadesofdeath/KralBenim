name: YouTube metadata fix

# Gives a channel's already uploaded videos (videos/*/*.youtube.json) the channel's YouTube category and
# "altered or synthetic content" (AI) box from tools/channels.py. Videos that already match are skipped;
# stops quietly when the daily API quota runs out (run again the next day).
run-name: "🛠️ YouTube metadata fix: ${{ inputs.channel }}"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel id (tools/channels.py): db or ag"
        required: true
        default: ag

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth
      - env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON_AG: ${{ secrets.YOUTUBE_TOKEN_JSON_AG }}
          CH: ${{ inputs.channel }}
        run: python tools/upload.py --fix-meta "$CH"
