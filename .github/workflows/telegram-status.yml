name: Telegram status

# One step of the day's live Telegram message, sent from the cloud (director) session, which has no
# Telegram token: it dispatches this workflow (GitHub MCP actions_run_trigger, ref claude/shorts-pipeline)
# and this job edits the same message with the TELEGRAM_BOT_TOKEN secret (tools/telegram.py status).
# The stage records are commit statuses on the anchor commit (no commit, no daily.yml trigger), so the
# Daily batch monitor later continues the very same message.
run-name: "📣 ${{ inputs.key }} ${{ inputs.video }} ${{ inputs.stage }} ${{ inputs.state }}"

on:
  workflow_dispatch:
    inputs:
      key:
        description: "Production date, e.g. 2026-10-20 (one message per date)"
        required: true
      stage:
        description: "plan | topic | script | chars | visual | preview | review | publish | push | any name (empty with batch)"
        required: false
        default: ""
      state:
        description: "wait | run | done | fail | skip | info"
        required: false
        default: "info"
      text:
        description: "Detail shown on the line (e.g. '2. tur: en düşük puan 7', '486 karakter')"
        required: false
        default: ""
      video:
        description: "Video slug, e.g. 01-emu-savasi (empty: the day's general section)"
        required: false
        default: ""
      title:
        description: "Video title (heading), first time a video is mentioned"
        required: false
        default: ""
      kind:
        description: "short | long"
        required: false
        default: ""
      progress:
        description: "Optional progress: 60%, 0.6 or 3/7"
        required: false
        default: ""
      batch:
        description: 'Several updates at once (JSON list of {stage, state, text, video, title, kind, progress})'
        required: false
        default: ""

permissions:
  contents: read
  statuses: write

# No concurrency group on purpose: GitHub would cancel queued runs (lost updates). Parallel runs are
# safe: every stage is its own record, and each run re-renders the message from all records.

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/
            config/
            videos/*/*.json
      - name: Update the live message
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEY: ${{ inputs.key }}
          STAGE: ${{ inputs.stage }}
          STATE: ${{ inputs.state }}
          TEXT: ${{ inputs.text }}
          VIDEO: ${{ inputs.video }}
          TITLE: ${{ inputs.title }}
          KIND: ${{ inputs.kind }}
          PROGRESS: ${{ inputs.progress }}
          BATCH: ${{ inputs.batch }}
        run: |
          args=(status "$KEY")
          if [ -n "$STAGE" ]; then args+=("$STAGE" "${STATE:-info}" "$TEXT"); fi
          [ -n "$VIDEO" ] && args+=(--video "$VIDEO")
          [ -n "$TITLE" ] && args+=(--title "$TITLE")
          [ -n "$KIND" ] && args+=(--kind "$KIND")
          [ -n "$PROGRESS" ] && args+=(--progress "$PROGRESS")
          [ -n "$BATCH" ] && args+=(--batch "$BATCH")
          python3 tools/telegram.py "${args[@]}" || true
