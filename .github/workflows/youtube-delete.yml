name: YouTube delete

# Deletes videos from one channel (e.g. videos uploaded to the wrong channel). upload.py --delete refuses
# when the channel's token belongs to another YouTube channel.
run-name: "🗑️ YouTube delete: ${{ inputs.channel }} ${{ inputs.ids }}"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel id (tools/channels.py): db or ag"
        required: true
      ids:
        description: "Space separated YouTube video ids"
        required: true

jobs:
  delete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth
      - env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON_AG: ${{ secrets.YOUTUBE_TOKEN_JSON_AG }}
          CH: ${{ inputs.channel }}
          IDS: ${{ inputs.ids }}
        run: python tools/upload.py --delete "$CH" $IDS
