name: Voice samples

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of voices
        default: "8"

jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          COUNT: ${{ inputs.count }}
        run: python tools/voice_samples.py "$COUNT"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: samples/
