name: Render video

on:
  workflow_dispatch:
    inputs:
      script:
        description: Script JSON path
        default: videos/2026-10-20/01-emu-savasi.json
      no_tts:
        description: "Silent draft (no ElevenLabs call)"
        default: "false"

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter
      - name: Python packages
        run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Build
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SCRIPT: ${{ inputs.script }}
          NO_TTS: ${{ inputs.no_tts }}
        run: |
          start=$(date +%s)
          if [ "$NO_TTS" = "true" ]; then python build.py "$SCRIPT" --no-tts; else python build.py "$SCRIPT"; fi
          echo "render took $(( $(date +%s) - start )) s"
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/video.mp4
            out/video.jpg
            out/*/timeline.json
