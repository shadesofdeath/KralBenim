name: Render video

on:
  workflow_dispatch:
    inputs:
      script:
        description: Script JSON path
        default: script.json

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter
      - name: Python packages
        run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Build
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SCRIPT: ${{ inputs.script }}
        run: python build.py "$SCRIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/video.mp4
            out/video.jpg
            out/*/timeline.json
