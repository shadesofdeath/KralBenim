name: Telegram setup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python tools/telegram.py setup
      - name: Commit chat id
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/telegram_chat_id
          git commit -m "Save Telegram chat id" && git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" && git push
