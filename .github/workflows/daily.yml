name: Daily batch

# Fires when new scripts land in videos/<date>/ (pushed by the daily Claude task),
# or manually for a given folder. Each script is rendered and uploaded in parallel.
on:
  push:
    paths: ["videos/**.json"]
  workflow_dispatch:
    inputs:
      dir:
        description: "Folder or single script to (re)build, e.g. videos/2026-10-16 or videos/2026-10-16/04-x.json"
        required: true
      upload:
        description: "Upload to YouTube"
        default: "true"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: list
        env:
          DIR: ${{ inputs.dir }}
        run: |
          if [ -f "$DIR" ]; then
            files="$DIR"
          elif [ -n "$DIR" ]; then
            files=$(ls "$DIR"/*.json | grep -v '\.youtube\.json$' || true)
          else
            files=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'videos/*/*.json' | grep -v '\.youtube\.json$' || true)
          fi
          echo "files=$(printf '%s\n' $files | jq -R . | jq -sc 'map(select(length>0))')" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    if: needs.plan.outputs.files != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 300   # studio long videos draw 3D in software
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        file: ${{ fromJson(needs.plan.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter
      - name: Python packages
        run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Names
        id: n
        env:
          F: ${{ matrix.file }}
        run: echo "name=$(basename "$(dirname "$F")")-$(basename "$F" .json)" >> "$GITHUB_OUTPUT"
      - name: TTS cache (re-renders do not spend ElevenLabs credits)
        id: tts
        uses: actions/cache/restore@v4
        with:
          path: out/*/
          key: tts-${{ steps.n.outputs.name }}-${{ hashFiles(matrix.file) }}
          restore-keys: tts-${{ steps.n.outputs.name }}-
      - name: Build
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          F: ${{ matrix.file }}
        run: python build.py "$F" -o "out/${{ steps.n.outputs.name }}.mp4"
      - name: Save TTS cache (also when the render fails, so a fixed re-run reuses the narration)
        if: always() && steps.tts.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: out/*/
          key: tts-${{ steps.n.outputs.name }}-${{ hashFiles(matrix.file) }}
      - name: Upload to YouTube
        if: inputs.upload != 'false'
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          F: ${{ matrix.file }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ] && [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then echo "YouTube secrets missing, skipping upload"; exit 0; fi
          python tools/upload.py "$F" "out/${{ steps.n.outputs.name }}.mp4"
          cp "out/${{ steps.n.outputs.name }}.youtube.json" "${F%.json}.youtube.json"
      - name: Send to Telegram (Instagram-ready)
        if: always() && steps.n.outputs.name != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          F: ${{ matrix.file }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ ! -f config/telegram_chat_id ]; then echo "Telegram not set up, skipping"; exit 0; fi
          V="out/${{ steps.n.outputs.name }}.mp4"
          if [ ! -f "$V" ]; then python tools/telegram.py text "⚠️ Render başarısız: $F"; exit 0; fi
          if grep -q '"format": "long"' "$F"; then
            python tools/telegram.py text "📺 Uzun video yüklendi: $(python -c "import json;print(json.load(open('$F'))['youtube']['title'])")"
          else
            python tools/telegram.py send "$F" "$V"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.n.outputs.name }}
          path: |
            out/${{ steps.n.outputs.name }}.mp4
            out/${{ steps.n.outputs.name }}.jpg
            videos/**/*.youtube.json
          retention-days: 14

  record:
    needs: render
    if: always() && needs.render.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: video-*
          path: results
          merge-multiple: true
      - name: Commit upload results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d results/videos ] && cp -r results/videos/. videos/ || true
          git add videos
          if git diff --cached --quiet; then echo "nothing to record"; exit 0; fi
          git commit -m "Record YouTube uploads"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
