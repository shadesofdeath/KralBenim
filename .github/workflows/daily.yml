name: Daily batch

# Fires when scripts land in videos/<date>/ (pushed by the daily Claude task), or manually for a folder or
# one script. Each video is built in three stages so one video renders on several runners at once:
#   prepare  (1 job per script)   TTS (cached) + timeline + media -> artifact prep-<name>
#   render   (N jobs per script)  build.py --shard i/N, ~one shard per 40 s of video (max 16)
#   finish   (1 job per script)   concat + audio + cover, YouTube upload, Telegram
#   monitor  (1 job)              keeps the live Telegram messages current (tools/live.py); best-effort
#   check    (1 job)              API check (tools/check.py): a broken YouTube login starts the phone login
on:
  push:
    paths: ["videos/**.json"]
  workflow_dispatch:
    inputs:
      dir:
        description: "Folder or single script to (re)build, e.g. videos/2026-10-16 or videos/2026-10-16/04-x.json"
        required: true
      upload:
        description: "Upload to YouTube"
        default: "true"

permissions:
  contents: write
  actions: write    # monitor: job states of this run; check: start the YouTube phone login
  statuses: write   # live status records (commit statuses on the anchor commit, tools/telegram.py Store)

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: list
        env:
          DIR: ${{ inputs.dir }}
        run: |
          is_script() { [[ "$1" =~ ^videos/[^/]+/[^/]+\.json$ ]] && [[ "$1" != *.youtube.json ]]; }
          files=""
          if [ -f "$DIR" ]; then
            files="$DIR"
          elif [ -n "$DIR" ]; then
            files=$(ls "$DIR"/*.json | grep -v '\.youtube\.json$' || true)
          else
            # new scripts, plus edited scripts never uploaded (no .youtube.json): nothing goes up twice
            for f in $(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'videos/*/*.json'); do
              if is_script "$f" && [ ! -f "${f%.json}.youtube.json" ]; then files="$files $f"; fi
            done
          fi
          echo "files=$(printf '%s\n' $files | jq -R . | jq -sc 'map(select(length>0))')" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    if: needs.plan.outputs.files != '[]'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-auth requests
      - name: API check (Telegram only on a problem)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON_AG: ${{ secrets.YOUTUBE_TOKEN_JSON_AG }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/check.py --notify problems --relogin

  monitor:
    needs: plan
    if: needs.plan.outputs.files != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    continue-on-error: true
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FILES: ${{ needs.plan.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/
            config/
            videos/*/*.json
      - name: Live status
        run: python3 tools/live.py monitor || true
      - name: Live status (cancelled run)
        if: cancelled()
        run: python3 tools/live.py monitor --once --footer "⛔ Çalışma iptal edildi" || true

  prepare:
    needs: plan
    if: needs.plan.outputs.files != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.plan.outputs.files) }}
    name: prepare ${{ matrix.file }}   # tools/live.py matches jobs by these names
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Names
        id: n
        env:
          F: ${{ matrix.file }}
        run: echo "name=$(basename "$(dirname "$F")")-$(basename "$F" .json)" >> "$GITHUB_OUTPUT"
      - name: TTS cache (re-renders do not spend ElevenLabs credits)
        id: tts
        uses: actions/cache/restore@v4
        with:
          path: out/*/
          key: tts-${{ steps.n.outputs.name }}-${{ hashFiles(matrix.file) }}
          restore-keys: tts-${{ steps.n.outputs.name }}-
      - name: Prepare (TTS, timeline, media)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          F: ${{ matrix.file }}
          NAME: ${{ steps.n.outputs.name }}
        run: |
          python build.py "$F" -o "out/$NAME.mp4" --prepare
          jq -c --arg f "$F" --arg n "$NAME" '{file: $f, name: $n, shards: .shards}' "out/$NAME.prepared.json" > "shards-$NAME.json"
      - name: Save TTS cache (also when the prepare fails, so a fixed re-run reuses the narration)
        if: always() && steps.tts.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: out/*/
          key: tts-${{ steps.n.outputs.name }}-${{ hashFiles(matrix.file) }}
      - uses: actions/upload-artifact@v4
        with:
          name: prep-${{ steps.n.outputs.name }}
          path: out/
          retention-days: 2
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: shards-${{ steps.n.outputs.name }}
          path: shards-${{ steps.n.outputs.name }}.json
          retention-days: 2

  # one render job per (script, shard): {file, name, shard, of}
  shards:
    needs: prepare
    if: always() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true   # every prepare failed: nothing to render, finish reports it
        with:
          pattern: shards-*
          path: shards
          merge-multiple: true
      - id: m
        run: |
          shopt -s nullglob
          files=(shards/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "include=[]" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "include=$(jq -sc '[.[] | . as $s | range(1; $s.shards + 1) | {file: $s.file, name: $s.name, shard: ., of: $s.shards}]' "${files[@]}")" >> "$GITHUB_OUTPUT"

  render:
    needs: shards
    if: always() && needs.shards.result == 'success' && needs.shards.outputs.include != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.shards.outputs.include) }}
    name: render ${{ matrix.name }} ${{ matrix.shard }}/${{ matrix.of }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - uses: actions/download-artifact@v4
        with:
          name: prep-${{ matrix.name }}
          path: out
      - name: Render shard
        env:
          F: ${{ matrix.file }}
          GITHUB_TOKEN: ${{ github.token }}
          LIVE_STATUS: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && '1' || '' }}
        # live.py wraps build.py (same exit code) and publishes the shard's progress for the monitor
        run: |
          python tools/live.py shard --name "${{ matrix.name }}" --shard "${{ matrix.shard }}" -- \
            python build.py "$F" -o "out/${{ matrix.name }}.mp4" --shard "${{ matrix.shard }}/${{ matrix.of }}"
      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.name }}-${{ matrix.shard }}
          path: out/${{ matrix.name }}.parts/
          if-no-files-found: ignore   # a trailing shard can be empty
          retention-days: 2
          compression-level: 0

  finish:
    needs: [plan, render]
    if: always() && needs.plan.outputs.files != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.plan.outputs.files) }}
    name: finish ${{ matrix.file }}
    env:
      F: ${{ matrix.file }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      LIVE_STATUS: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - name: Names
        id: n
        run: echo "name=$(basename "$(dirname "$F")")-$(basename "$F" .json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        continue-on-error: true   # prepare failed: the Build step fails and Telegram reports it
        with:
          name: prep-${{ steps.n.outputs.name }}
          path: out
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: seg-${{ steps.n.outputs.name }}-*
          path: out/${{ steps.n.outputs.name }}.parts
          merge-multiple: true
      - name: Build (concat shards, mux audio, cover)
        run: python build.py "$F" -o "out/${{ steps.n.outputs.name }}.mp4" --finish
      - name: Upload to YouTube
        if: inputs.upload != 'false'
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON_AG: ${{ secrets.YOUTUBE_TOKEN_JSON_AG }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # upload.py uses the token of the script's channel; no token: skipped, no .youtube.json
          N="out/${{ steps.n.outputs.name }}"
          python tools/upload.py "$F" "$N.mp4"
          [ -f "$N.youtube.json" ] || exit 0
          cp "$N.youtube.json" "${F%.json}.youtube.json"
          python tools/live.py note --name "${{ steps.n.outputs.name }}" --url "$(jq -r '.url // empty' "$N.youtube.json")" || true
      - name: Send to Telegram (Instagram-ready)
        if: always() && steps.n.outputs.name != ''
        continue-on-error: true
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ ! -f config/telegram_chat_id ]; then echo "Telegram not set up"; exit 0; fi
          V="out/${{ steps.n.outputs.name }}.mp4"
          # a failed render already shows ❌ in the video's live message
          if [ ! -f "$V" ]; then [ -n "$LIVE_STATUS" ] || python tools/telegram.py text "⚠️ Render başarısız: $F"; exit 0; fi
          if [ "$(jq -r '.format // "short"' "$F")" = "long" ]; then
            python tools/telegram.py text "📺 Uzun video hazır: $(jq -r '.youtube.title' "$F")"
          else
            python tools/telegram.py send "$F" "$V"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.n.outputs.name }}
          path: |
            out/${{ steps.n.outputs.name }}.mp4
            out/${{ steps.n.outputs.name }}.jpg
            videos/**/*.youtube.json
          retention-days: 14

  record:
    needs: finish
    if: always() && needs.finish.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: video-*
          path: results
          merge-multiple: true
      - name: Commit upload results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d results/videos ] && cp -r results/videos/. videos/ || true
          git add videos
          if git diff --cached --quiet; then echo "nothing to record"; exit 0; fi
          git commit -m "Record YouTube uploads"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
